name: Atualizar troféus do GitHub

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar troféus em português
        run: node scripts/update-github-trophies.mjs

      - name: Publicar alterações
        shell: bash
        run: |
          if git diff --quiet -- assets/github-trophies-pt-br.svg; then
            echo "Os troféus já estão atualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies-pt-br.svg
          git commit -m "chore: atualizar troféus do GitHub"
          git push
