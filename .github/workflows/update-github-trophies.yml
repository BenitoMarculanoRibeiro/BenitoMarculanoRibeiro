name: Atualizar troféus do GitHub

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-trophies-pt-br.svg"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-trophies
  cancel-in-progress: false

jobs:
  update-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar testes
        run: npm test

      - name: Gerar troféus em português
        run: npm run update-trophies

      - name: Publicar alterações
        shell: bash
        run: |
          if git diff --quiet -- assets/github-trophies-pt-br.svg; then
            echo "Os troféus já estão atualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies-pt-br.svg
          git commit -m "chore: atualizar troféus do GitHub [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
